<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b4f72">
<title>Painel — Auxiliar de Pesquisa</title>
<link rel="stylesheet" href="../style.css">
<style>
  main { max-width: 1100px; }
  .cabecalho {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .cabecalho h1 { font-size: 20px; margin: 0; }
  .cartao-form {
    background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio);
    padding: 14px 16px; margin-bottom: 18px; box-shadow: var(--sombra);
  }
  .linha-form { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 10px; align-items: end; }
  .linha-form label.rot { margin-top: 0; }
  .linha-form .btn { height: 40px; }
  @media (max-width: 700px) { .linha-form { grid-template-columns: 1fr; } }
  table.usuarios { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--papel); }
  table.usuarios th, table.usuarios td {
    border-bottom: 1px solid var(--linha); padding: 9px 8px; text-align: left; vertical-align: top;
  }
  table.usuarios th { background: var(--fundo); font-size: 12.5px; text-transform: uppercase; letter-spacing: .3px; }
  .rolagem { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); }
  .etiqueta { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .et-ok { color: #1e5c22; border-color: #1e5c22; background: #eef6ee; }
  .et-vencido { color: var(--alerta); border-color: var(--alerta); background: var(--alerta-fundo); }
  .et-inativo { color: var(--perigo); border-color: var(--perigo); background: #fdeeed; }
  @media (prefers-color-scheme: dark) { .et-ok { background: #16301a; color: #93d39a; border-color: #93d39a; } }
  .acoes-linha { display: flex; gap: 4px; flex-wrap: wrap; }
  .codigo {
    font-family: "DejaVu Sans Mono", monospace; font-size: 15px; letter-spacing: 2px;
    font-weight: 700; color: var(--marca);
  }
</style>
</head>
<body>

<!-- login do administrador -->
<div id="tela-login" class="tela">
  <div class="login-caixa">
    <div class="login-marca">Painel de usuários</div>
    <label class="rot">E-mail de administrador</label>
    <input type="email" id="login-email" autocomplete="username">
    <label class="rot">Senha</label>
    <input type="password" id="login-senha" autocomplete="current-password">
    <button class="btn primario largo" id="bt-entrar">Entrar</button>
    <div id="login-erro" class="alerta" hidden></div>
    <p class="dica" style="margin-top:14px">Só contas marcadas como administradoras entram aqui.</p>
  </div>
</div>

<!-- painel -->
<div id="tela-painel" class="tela" hidden>
  <main>
    <div class="cabecalho">
      <h1>Usuários do Auxiliar de Pesquisa</h1>
      <div class="acoes-linha">
        <span id="quem" class="dica"></span>
        <button class="btn pequeno" id="bt-atualizar">Atualizar</button>
        <button class="btn pequeno" id="bt-sair">Sair</button>
      </div>
    </div>

    <div class="cartao-form">
      <h3 style="margin-top:0">Cadastrar novo usuário</h3>
      <div class="linha-form">
        <div>
          <label class="rot">Nome completo</label>
          <input type="text" id="novo-nome" placeholder="Ex.: Lucas Silva Leal">
        </div>
        <div>
          <label class="rot">E-mail</label>
          <input type="email" id="novo-email" placeholder="pessoa@exemplo.com">
        </div>
        <div>
          <label class="rot">Plano</label>
          <select class="campo" id="novo-plano">
            <option value="teste">Teste (15 dias)</option>
            <option value="1m">1 mês</option>
            <option value="3m">3 meses</option>
            <option value="6m">6 meses</option>
            <option value="1a">1 ano</option>
            <option value="vitalicio">Vitalício</option>
          </select>
        </div>
        <button class="btn primario" id="bt-criar">Cadastrar</button>
      </div>
      <div id="form-erro" class="alerta" hidden></div>
    </div>

    <div class="rolagem">
      <table class="usuarios">
        <thead>
          <tr>
            <th>Pessoa</th><th>Plano</th><th>Situação</th><th>Código</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <tr><td colspan="5" class="dica" style="padding:20px">Carregando…</td></tr>
        </tbody>
      </table>
    </div>
    <p class="dica" id="rodape-conta"></p>
  </main>
</div>

<div id="fundo" class="fundo" hidden>
  <div class="janela">
    <div class="janela-topo">
      <h2 id="janela-titulo"></h2>
      <button id="janela-fechar" class="btn-icone">×</button>
    </div>
    <div id="janela-corpo" class="janela-corpo"></div>
    <div id="janela-rodape" class="janela-rodape"></div>
  </div>
</div>

<div id="aviso" class="aviso" hidden></div>

<script src="../js/config-app.js"></script>
<script src="../js/auth.js"></script>
<script src="painel.js"></script>
</body>
</html>
