<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4f72">
<title>Auxiliar de Pesquisa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auxiliar">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ====================== TELA INICIAL ====================== -->
<div id="tela-inicio" class="tela">

  <header class="topo">
    <div class="topo-linha">
      <div class="busca-caixa">
        <span class="lupa" aria-hidden="true">⌕</span>
        <input id="busca-simples" type="search" placeholder="Pesquisar título, autor ou editora"
               autocomplete="off" enterkeyhint="search">
        <button id="limpar-busca" class="limpa" title="Limpar" hidden>×</button>
      </div>
      <button id="btn-avancada" class="btn-icone" title="Pesquisa avançada">⚙︎<span class="rotulo">Avançada</span></button>
      <button id="btn-config" class="btn-icone" title="Configurações">☰<span class="rotulo">Menu</span></button>
    </div>

    <nav class="categorias" id="barra-categorias" aria-label="Categorias"></nav>
  </header>

  <main>
    <div id="titulo-secao" class="titulo-secao"></div>
    <div id="barra-selecao" class="barra-selecao" hidden>
      <span id="selecao-conta">0 selecionadas</span>
      <div>
        <button id="sel-todas" class="btn pequeno">Marcar todas</button>
        <button id="sel-mover" class="btn pequeno primario">Mover para…</button>
        <button id="sel-sair" class="btn pequeno">Cancelar</button>
      </div>
    </div>

    <div id="grade" class="grade"></div>
    <div id="sentinela" style="height:1px"></div>
    <p id="vazio" class="vazio" hidden></p>
  </main>
</div>

<!-- ====================== TELA DA OBRA ====================== -->
<div id="tela-obra" class="tela" hidden>
  <header class="topo">
    <div class="topo-linha">
      <button class="btn-icone voltar" data-voltar>‹<span class="rotulo">Voltar</span></button>
      <div class="busca-caixa">
        <span class="lupa" aria-hidden="true">⌕</span>
        <input id="busca-citacoes" type="search" placeholder="Pesquisar nas citações desta obra" autocomplete="off">
      </div>
    </div>
  </header>
  <main>
    <div id="obra-cabecalho"></div>
    <div id="obra-citacoes"></div>
  </main>
</div>

<!-- ================== TELA DE PESQUISA AVANÇADA ================== -->
<div id="tela-busca" class="tela" hidden>
  <header class="topo">
    <div class="topo-linha">
      <button class="btn-icone voltar" data-voltar>‹<span class="rotulo">Voltar</span></button>
      <div class="busca-caixa">
        <span class="lupa" aria-hidden="true">⌕</span>
        <input id="busca-avancada" type="search" placeholder="Procurar dentro do texto das citações" autocomplete="off">
      </div>
    </div>
    <div class="filtros">
      <select id="filtro-tipo" class="campo"><option value="">Todos os tipos</option></select>
      <select id="filtro-categoria" class="campo"><option value="">Todas as categorias</option></select>
      <label class="marca"><input type="checkbox" id="filtro-incompletas"> Só referências incompletas</label>
    </div>
  </header>
  <main id="resultado-busca"></main>
</div>

<!-- ====================== JANELA (modal) ====================== -->
<div id="fundo" class="fundo" hidden>
  <div class="janela" role="dialog" aria-modal="true">
    <div class="janela-topo">
      <h2 id="janela-titulo"></h2>
      <button id="janela-fechar" class="btn-icone" title="Fechar">×</button>
    </div>
    <div id="janela-corpo" class="janela-corpo"></div>
    <div id="janela-rodape" class="janela-rodape"></div>
  </div>
</div>

<div id="aviso" class="aviso" hidden></div>

<script src="vendor/dexie.min.js"></script>
<script src="js/db.js"></script>
<script src="js/referencias.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
